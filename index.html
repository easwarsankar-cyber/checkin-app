<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<title>Session Check-In</title>
<style>
  :root { --bg:#f5f6f8; --card:#ffffff; --text:#1d1f24; --muted:#6b7280; --accent:#2563eb; --ok:#16a34a; --err:#dc2626; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  header { background: var(--accent); color: #fff; padding: 16px; font-size: 1.2rem; font-weight: 600; }
  main { padding: 16px; max-width: 520px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 4px; }
  input, textarea { width: 100%; font: inherit; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; color: var(--text); }
  textarea { min-height: 90px; resize: vertical; }
  button {
    width: 100%; font: inherit; font-weight: 600; padding: 14px; margin-top: 12px;
    border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer;
  }
  button.secondary { background: #e5e7eb; color: var(--text); }
  button:disabled { opacity: .5; }
  .tabs { display: flex; gap: 8px; }
  .tabs button { margin-top: 0; }
  .hidden { display: none !important; }
  #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-top: 12px; }
  .info { background: #eff6ff; border-radius: 8px; padding: 12px; margin-top: 12px; font-size: .95rem; line-height: 1.5; }
  .status { margin-top: 12px; font-size: .95rem; min-height: 1.2em; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  .muted { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>

<header>Session Check-In</header>

<main>
  <div class="tabs card">
    <button id="tabCheckin">My Profile</button>
    <button id="tabProfile" class="secondary">My Profile</button>
  </div>

  <!-- CHECK IN -->
  <section id="checkinView" class="card hidden">
    <h3 style="margin-top:0">Check in to a session</h3>
    <p class="muted">Scan the session QR code. The location and date are read from the code (today's date is used if the code has none).</p>
    <button id="scanBtn">Scan QR code</button>
    <button id="stopBtn" class="secondary hidden">Cancel scan</button>
    <div id="reader" class="hidden"></div>

    <div id="sessionInfo" class="info hidden">
      <div><strong>Location:</strong> <span id="sessLocation"></span></div>
      <div><strong>Date:</strong> <span id="sessDate"></span></div>
    </div>

    <label for="message">Check-in message</label>
    <textarea id="message" placeholder="e.g. Arrived, ready for the session"></textarea>

    <button id="submitBtn" disabled>Send check-in</button>
    <div id="checkinStatus" class="status"></div>
  </section>

  <!-- PROFILE -->
  <section id="profileView" class="card">
    <h3 style="margin-top:0">Personal profile</h3>
    <label for="firstName">First name *</label>
    <input id="firstName" autocomplete="given-name">
    <label for="lastName">Last name *</label>
    <input id="lastName" autocomplete="family-name">
    <label for="location">Preferred location</label>
    <input id="location" autocomplete="location">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email">
    <label for="phone">Phone</label>
    <input id="phone" type="tel" autocomplete="tel">
    <button id="saveProfile">Save profile</button>
    <div id="profileStatus" class="status"></div>
  </section>

</main>

<!-- QR scanner library (served from cdnjs) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
  // ====== CONFIGURATION ======
  // Paste the Web App URL from your Google Apps Script deployment here.
  https://script.google.com/macros/s/AKfycbzl75R7jLN3FYu2q8WfrNYzu3j5LYeDcNJpYy7He-cVBPsDkPXdDcHFdEt4ciJN2v0PKw/exec
  const CONFIG = {
    APPS_SCRIPT_URL: "PASTE_YOUR_WEB_APP_URL_HERE"
  };

  const PROFILE_KEY = "checkin.profile";
  const PROFILE_FIELDS = ["firstName", "lastName", "location", "email", "phone"];
  const $ = id => document.getElementById(id);

  let scanner = null;
  let session = null; // { location, date }

  // ---------- Tabs ----------
  function showTab(name) {
    const isProfile = name === "profile";
    $("profileView").classList.toggle("hidden", !isProfile);
    $("checkinView").classList.toggle("hidden", isProfile);
    $("tabProfile").classList.toggle("secondary", !isProfile);
    $("tabCheckin").classList.toggle("secondary", isProfile);
    if (isProfile) stopScan();
  }
  $("tabProfile").onclick = () => showTab("profile");
  $("tabCheckin").onclick = () => showTab("checkin");

  // ---------- Profile ----------
  function getProfile() {
    return JSON.parse(localStorage.getItem(PROFILE_KEY) || "{}");
  }

  function loadProfile() {
    const p = getProfile();
    PROFILE_FIELDS.forEach(f => $(f).value = p[f] || "");
  }

  function saveProfile() {
    const p = {};
    PROFILE_FIELDS.forEach(f => p[f] = $(f).value.trim());
    if (!p.firstName || !p.lastName) {
      setStatus("profileStatus", "First and last name are required.", "err");
      return;
    }
    localStorage.setItem(PROFILE_KEY, JSON.stringify(p));
    setStatus("profileStatus", "Profile saved.", "ok");
  }
  $("saveProfile").onclick = saveProfile;

  // ---------- Status helper ----------
  function setStatus(id, text, cls = "") {
    const el = $(id);
    el.textContent = text;
    el.className = "status " + cls;
  }

  // ---------- QR parsing ----------
  // Accepts either JSON like {"location":"Room 4B","date":"2026-11-25"}
  // or plain text, which is treated as the location.
  function parseSession(text) {
    const today = new Date().toLocaleDateString("en-CA"); // YYYY-MM-DD in local time
    try {
      const obj = JSON.parse(text);
      if (obj && typeof obj === "object") {
        return {
          location: String(obj.location || obj.session || "Unknown").trim(),
          date: String(obj.date || today).trim()
        };
      }
    } catch (_) { /* not JSON */ }
    return { location: text.trim(), date: today };
  }

  // ---------- Scanning ----------
  async function startScan() {
    if (!window.Html5Qrcode) {
      setStatus("checkinStatus", "Scanner library failed to load. Check your internet connection.", "err");
      return;
    }
    setStatus("checkinStatus", "");
    $("reader").classList.remove("hidden");
    $("stopBtn").classList.remove("hidden");
    $("scanBtn").classList.add("hidden");

    scanner = new Html5Qrcode("reader");
    try {
      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        onScanSuccess,
        () => {} // ignore per-frame decode misses
      );
    } catch (err) {
      setStatus("checkinStatus", "Camera unavailable. Allow camera access and try again.", "err");
      stopScan();
    }
  }

  async function stopScan() {
    if (scanner) {
      try {
        if (scanner.isScanning) await scanner.stop();
        scanner.clear();
      } catch (_) { /* ignore */ }
      scanner = null;
    }
    $("reader").classList.add("hidden");
    $("stopBtn").classList.add("hidden");
    $("scanBtn").classList.remove("hidden");
  }

  async function onScanSuccess(decodedText) {
    await stopScan();
    session = parseSession(decodedText);
    $("sessLocation").textContent = session.location;
    $("sessDate").textContent = session.date;
    $("sessionInfo").classList.remove("hidden");
    $("submitBtn").disabled = false;
    setStatus("checkinStatus", "Session scanned. Add a message and send.", "ok");
  }

  $("scanBtn").onclick = startScan;
  $("stopBtn").onclick = stopScan;

  // ---------- Submit ----------
  async function submitCheckIn() {
    if (!session) {
      setStatus("checkinStatus", "Scan a session QR code first.", "err");
      return;
    }
    if (CONFIG.APPS_SCRIPT_URL.startsWith("PASTE")) {
      setStatus("checkinStatus", "The backend URL is not set in the app code.", "err");
      return;
    }
    const profile = getProfile();
    if (!profile.firstName) {
      setStatus("checkinStatus", "Save your profile first.", "err");
      showTab("profile");
      return;
    }

    const payload = {
      timestamp: new Date().toISOString(),
      firstName: profile.firstName,
      lastName: profile.lastName,
      location: profile.location || "",
      email: profile.email || "",
      phone: profile.phone || "",
      message: $("message").value.trim(),
      sessionLocation: session.location,
      sessionDate: session.date
    };

    $("submitBtn").disabled = true;
    setStatus("checkinStatus", "Sending...");
    try {
      // Apps Script web apps don't return CORS headers, so the response is opaque.
      await fetch(CONFIG.APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      setStatus("checkinStatus", "Check-in sent!", "ok");
      session = null;
      $("sessionInfo").classList.add("hidden");
      $("message").value = "";
    } catch (err) {
      setStatus("checkinStatus", "Failed to send. Check your connection and try again.", "err");
      $("submitBtn").disabled = false;
    }
  }
  $("submitBtn").onclick = submitCheckIn;

  // ---------- Init ----------
  loadProfile();
  showTab("profile");
</script>
</body>
</html>
